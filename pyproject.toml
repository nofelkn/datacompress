[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nofelkn-datacompress"
version = "0.1.0"
description = "从输入中抽取数值，计算训练数据的压缩比相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nofelkn" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nofelkn.github.io"
Repository = "https://github.com/nofelkn/datacompress"
Issues = "https://github.com/nofelkn/datacompress/issues"

[project.scripts]
datacompress = "datacompress:main"

[tool.setuptools]
py-modules = ["datacompress"]
